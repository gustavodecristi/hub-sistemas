<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Definição da cor e estilo das linhas -->
  <g stroke="rgb(1, 95, 65)" stroke-width="10" stroke-linecap="round">
    <!-- Linhas de Conexão -->
    <line x1="200" y1="200" x2="100" y2="120" />
    <line x1="200" y1="200" x2="300" y2="80" />
    <line x1="200" y1="200" x2="320" y2="220" />
    <line x1="200" y1="200" x2="280" y2="330" />
    <line x1="200" y1="200" x2="120" y2="310" />
  </g>

  <!-- Círculos (Nós) -->
  <g fill="rgb(1, 95, 65)">
    <!-- Nó Central -->
    <circle cx="200" cy="200" r="35" />
    
    <!-- Nós Periféricos -->
    <circle cx="100" cy="120" r="25" />
    <circle cx="300" cy="80" r="30" />
    <circle cx="320" cy="220" r="22" />
    <circle cx="280" cy="330" r="28" />
    <circle cx="120" cy="310" r="26" />
  </g>
</svg>
